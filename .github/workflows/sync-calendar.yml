name: Đồng bộ lịch công tác Hà Linh
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-calendar.yml'
      - 'scripts/sync_calendar.py'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: calendar-pages
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public calendar (keep last copy on source failure)
        id: sync
        continue-on-error: true
        run: python scripts/sync_calendar.py
      - name: Require a valid saved calendar
        run: python -c "import json; d=json.load(open('calendar.json', encoding='utf-8')); assert d['events'] and d['updatedAt']"
      - name: Save refreshed calendar
        if: steps.sync.outcome == 'success'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add calendar.json
          if ! git diff --cached --quiet; then
            git commit -m 'Cập nhật lịch công tác công khai Hà Linh'
            git pull --rebase origin main
            git push
          fi
      - name: Prepare public site
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/scripts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed site
        id: deployment
        uses: actions/deploy-pages@v4